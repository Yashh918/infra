_format_version: "3.0"

services:
  - name: auth-service
    # url: http://172.18.0.4:8080
    url: http://auth-service:8080
    routes:
      - name: auth-route
        paths:
          - /api/v1/auth
        strip_path: false
  
  - name: user-service
    # url: http://172.18.0.5:8081
    url: http://user-service:8081
    routes:
      - name: user-route
        paths:
          - /api/v1/users
        strip_path: false